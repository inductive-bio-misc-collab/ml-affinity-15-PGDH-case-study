[project]
name = "ml-affinity-paper-clean"
version = "0.1.0"
description = "Reproducibility package for the 15-PGDH affinity benchmarking paper"
requires-python = ">=3.11,<3.13"
dependencies = [
    "biopython>=1.81",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "rdkit>=2024.3",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "seaborn>=0.13",
]

[project.optional-dependencies]
boltz = ["boltz>=2.0.0"]

[tool.uv]
package = false
required-version = ">=0.11.6"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
exclude-newer = "3 days"
